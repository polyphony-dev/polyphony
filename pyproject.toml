[project]
name = "polyphony"
version = "0.4.2"
description = "Python based High Level Synthesis compiler"
readme = "README.md"
license = { text = "MIT" }
authors = [{ name = "Hiroaki Kataoka", email = "ktok07b6@gmail.com" }]
keywords = ["HLS", "High Level Synthesis", "FPGA", "HDL", "Verilog"]
requires-python = ">=3.12"
dependencies = [
    "mutmut>=3.5.0",
    "pydantic>=2.0",
]

[project.scripts]
polyphony = "polyphony.compiler.__main__:main"

[project.urls]
Homepage = "https://github.com/ktok07b6/polyphony"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[dependency-groups]
dev = [
    "ruff",
    "pytest",
    "pytest-cov>=7.0.0",
    "pyright>=1.1.408",
]

[tool.coverage.run]
source = ["polyphony"]
omit = ["polyphony/_internal/*"]

[tool.coverage.report]
omit = ["polyphony/_internal/*"]

[tool.ruff]
line-length = 120
target-version = "py312"

[tool.ruff.lint]
ignore = ["E221", "E231", "E241", "E265", "F403", "F405"]

[tool.ruff.format]
quote-style = "double"
